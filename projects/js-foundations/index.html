<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Dashboard — JS/TS Foundations</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="dash-header">
        <div>
          <h1 id="greeting">Hello</h1>
          <p id="quote" class="quote">Loading a quote…</p>
        </div>
        <time id="clock" class="clock">--:--:--</time>
      </header>

      <section class="tasks">
        <form id="task-form">
          <input id="task-input" placeholder="Add a task…" aria-label="New task" />
          <button type="submit">Add</button>
        </form>
        <p id="stats" class="stats"></p>
        <ul id="task-list" class="task-list"></ul>
      </section>
    </div>

    <!-- The completed Part 10 (vanilla JS) → Part 20 (TypeScript) reference. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
